name: CBS / GIS Yapay Zeka Ajani Gunluk 3 Ogun Mail Raporu (08:00 - 13:00 - 18:00 TSI)

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 TSI
    - cron: '0 10 * * *'  # 13:00 TSI
    - cron: '0 15 * * *'  # 18:00 TSI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-agent-scan-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Yapay Zeka Ajanini Calistir ve Mail Gonder
        env:
          SMTP_HOST: 'smtp.gmail.com'
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ai_agent.py --slot "Otomatik AI Ajan Raporu (08:00 / 13:00 / 18:00)"

      - name: Ajan Rapor Arsivini (agent_reports.json) Guncelle
        run: |
          git config user.name "cbs-gis-ai-agent"
          git config user.email "cbs-gis-ai-agent@users.noreply.github.com"
          git add agent_reports.json agent_seen_urls.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: AI ajan mail raporu arsivlendi [skip ci]"
          git push
